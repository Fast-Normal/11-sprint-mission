spring:
  application:
    name: discodeit
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  boot:
    admin:
      client:
        url: http://localhost:9090  # admin 서버 포트
        instance:
          service-url: http://localhost:8080  # discodeit 포트
  servlet:
    multipart:
      maxFileSize: 10MB # 파일 하나의 최대 크기
      maxRequestSize: 30MB  # 한 번에 최대 업로드 가능 용량
    hikari:
      health-check-properties:
        connectivityCheckTimeoutMs: 1000
        expected99thPercentileMs: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: true
  sql:
    init:
      mode: never

logging:
  level:
    root: info

discodeit:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      region: ${AWS_S3_REGION}
      credentials:
        access-key: ${AWS_S3_ACCESS_KEY}
        secret-key: ${AWS_S3_SECRET_KEY}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}

aws:
  region: ${AWS_S3_REGION}
  credentials:
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}
  s3:
    bucket: ${AWS_S3_BUCKET}

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    path: /docs
    enabled: true
    tagsSorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    url: /api=docs
  default-produces-media-type: application/json

management:
  endpoint:
    info:
      env:
        enabled: true # info 블록의 모든 값을 보기 위한 설정
    health:
      group:
        customHealth:
          include: diskSpace, ping, externalApi
          show-components: always
      show-details: always
      db:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers
  health:
    externalApi:
      enabled: true
    httpbin:
      enabled: true
    defaults:
      enabled: true

admin:
  username: ${ADMIN_USERNAME:Admin}
  email: ${ADMIN_EMAIL:Admin@admin.com}
  password: ${ADMIN_PASSWORD}

remember-me:
  key: ${REMEMBER_ME_KEY}

info:
  app:
    name: Discodeit
    version: 1.7.0
  java:
    version: 17
  spring-boot:
    version: 3.5.7
